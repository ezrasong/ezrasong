name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * *'

concurrency:
  group: profile-metrics

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify public query permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query=$(python3 - <<'PY'
          from pathlib import Path
          query = Path('.github/metrics/repositories.graphql').read_text()
          for key, value in {
              'account': 'user', 'type': 'repositories', 'login': 'ezrasong',
              'after': '', 'repositories': '25', 'forks': ', isFork: false',
              'affiliations': '', 'constraints': '',
          }.items():
              query = query.replace(f'${key}', value)
          print(query)
          PY
          )
          gh api graphql -f "query=$query" --jq '.data.user.repositories | {repos: (.nodes | length), languages: ([.nodes[].languages.edges[].node.name] | unique | length)}'

      - name: Render profile cards with Metrics
        env:
          INPUT_TOKEN: ${{ github.token }}
          INPUT_USER: ${{ github.repository_owner }}
          INPUT_OUTPUT_ACTION: none
          INPUT_PLUGINS_ERRORS_FATAL: 'yes'
          INPUT_RETRIES: '2'
          INPUT_RETRIES_DELAY: '2'
          INPUT_DEBUG: 'yes'
          INPUT_BASE: activity, repositories
          INPUT_REPOSITORIES_AFFILIATIONS: ''
          INPUT_REPOSITORIES_BATCH: '25'
          INPUT_CONFIG_TIMEZONE: America/Toronto
          INPUT_CONFIG_ANIMATIONS: 'no'
          INPUT_CONFIG_PADDING: '0, 8'
          INPUT_PLUGIN_ISOCALENDAR: 'yes'
          INPUT_PLUGIN_ISOCALENDAR_DURATION: full-year
          INPUT_PLUGIN_LANGUAGES: 'yes'
          INPUT_PLUGIN_LANGUAGES_LIMIT: '6'
        run: |
          export INPUT_EXTRAS_CSS="$(<.github/metrics/theme.css)"
          mkdir -p "$RUNNER_TEMP/profile-metrics"
          for layout in large regular; do
            filename=github-metrics.svg
            if [[ "$layout" == large ]]; then
              filename=github-metrics-wide.svg
            fi

            docker run --rm --init \
              --env INPUT_TOKEN --env INPUT_USER --env INPUT_OUTPUT_ACTION \
              --env INPUT_PLUGINS_ERRORS_FATAL --env INPUT_RETRIES --env INPUT_RETRIES_DELAY --env INPUT_DEBUG \
              --env INPUT_BASE --env INPUT_REPOSITORIES_AFFILIATIONS --env INPUT_REPOSITORIES_BATCH \
              --env INPUT_CONFIG_TIMEZONE --env INPUT_CONFIG_ANIMATIONS --env INPUT_CONFIG_PADDING \
              --env INPUT_PLUGIN_ISOCALENDAR --env INPUT_PLUGIN_ISOCALENDAR_DURATION \
              --env INPUT_PLUGIN_LANGUAGES --env INPUT_PLUGIN_LANGUAGES_LIMIT --env INPUT_EXTRAS_CSS \
              --env "INPUT_CONFIG_DISPLAY=$layout" --env "INPUT_FILENAME=$filename" \
              --mount "type=bind,src=$RUNNER_TEMP/profile-metrics,dst=/renders" \
              --mount "type=bind,src=$PWD/.github/metrics/repositories.graphql,dst=/metrics/source/plugins/base/queries/repositories.graphql,readonly" \
              ghcr.io/lowlighter/metrics:v3.34@sha256:257392f90340f916cb8b815026f259399f6b246d3eb7de38b58bfe7a07bd5b65
          done

      - name: Verify and publish both cards
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          render_dir = Path(os.environ['RUNNER_TEMP']) / 'profile-metrics'
          for filename, width in (('github-metrics.svg', '480'), ('github-metrics-wide.svg', '960')):
              card = ET.parse(render_dir / filename).getroot()
              titles = [''.join(node.itertext()).strip() for node in card.iter('{http://www.w3.org/1999/xhtml}h2')]
              language_bar = any(node.get('class') == 'bar' for node in card.iter('{http://www.w3.org/2000/svg}svg'))
              print(f'{filename} ({card.get("width")}px, language bar={language_bar}): {", ".join(titles)}', flush=True)
              if card.get('width') != width or 'Contributions calendar' not in titles or not language_bar:
                  raise ValueError(f'{filename} is missing activity data or has the wrong layout')
          PY

          cp "$RUNNER_TEMP/profile-metrics/"github-metrics{,-wide}.svg assets/
          git add -- assets/github-metrics.svg assets/github-metrics-wide.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update GitHub metrics'
          git push
