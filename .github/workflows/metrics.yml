name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * *'

concurrency:
  group: profile-metrics

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        include:
          - display: large
            filename: assets/github-metrics-wide.svg
          - display: regular
            filename: assets/github-metrics.svg
    permissions:
      contents: write
    steps:
      - name: Verify public repository access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f 'query=query { user(login: "ezrasong") { repositories(first: 25, isFork: false, privacy: PUBLIC) { totalCount nodes { languages(first: 1) { totalCount } } } } }' --jq '.data.user.repositories | {publicRepositories: .totalCount, repositoriesWithLanguages: ([.nodes[] | select(.languages.totalCount > 0)] | length)} | if .publicRepositories < 2 or .repositoriesWithLanguages < 2 then error("Repository token returned incomplete public data") else . end'
      - name: Render GitHub activity
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ezrasong
          filename: ${{ matrix.filename }}
          committer_message: Update GitHub metrics
          output_action: none
          plugins_errors_fatal: 'yes'
          retries: 2
          retries_delay: 2
          base: activity, repositories
          repositories_affiliations: ''
          repositories_batch: 25
          config_timezone: America/Toronto
          config_animations: 'no'
          config_display: ${{ matrix.display }}
          config_padding: '0, 8'
          plugin_isocalendar: 'yes'
          plugin_isocalendar_duration: full-year
          plugin_languages: 'yes'
          plugin_languages_limit: 6
          extras_css: |
            svg { color: #e6edf3; }
            .items-wrapper {
              box-sizing: border-box;
              padding: 12px 15px;
              background: #0d1117;
              border: 1px solid #30363d;
              border-radius: 6px;
            }
            svg.large .items-wrapper {
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              grid-template-rows: repeat(4, auto);
              column-gap: 20px;
              align-items: start;
            }
            svg.large .items-wrapper > section {
              grid-column: 1;
              width: auto;
            }
            svg.large .items-wrapper > section:last-child {
              grid-column: 2;
              grid-row: 1 / -1;
              align-self: stretch;
              border-left: 1px solid #30363d;
              padding-left: 14px;
            }
            /* Metrics draws the large language bar at a fixed 920px. */
            svg.large .items-wrapper > .column .bar { transform: scaleX(.49); }
            h1, h2, h3 { color: #58a6ff; }
            .field svg { fill: #8b949e; }
            path[fill="#ebedf0" i] { fill: #161b22; }
            path[fill="#9be9a8" i] { fill: #0e4429; }
            path[fill="#40c463" i] { fill: #006d32; }
            path[fill="#30a14e" i] { fill: #26a641; }
            path[fill="#216e39" i] { fill: #39d353; }
      - name: Check public repository coverage
        env:
          METRICS_FILE: /metrics_renders/${{ matrix.filename }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ['METRICS_FILE']).getroot()
          titles = [''.join(node.itertext()).strip() for node in root.iter('{http://www.w3.org/1999/xhtml}h2')]
          print('\n'.join(titles))
          assert any(re.fullmatch(r'(?:[2-9]|[1-9][0-9]+) Repositories', title) for title in titles)
          assert any(re.fullmatch(r'(?:[2-9]|[1-9][0-9]+) Languages', title) for title in titles)
          PY
